<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa interactivo de los departamentos de Francia</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
:root {
  --blue: #86a9dc;
  --blue-dark: #476b9d;
  --blue-light: #dbe7f7;

  --gold: #c69a54;
  --gold-dark: #8e672e;
  --gold-light: #ead7b7;

  --ink: #182333;
  --white: #ffffff;
  --border: #c9d3e0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background:
    linear-gradient(
      135deg,
      #eef3f9 0%,
      #ffffff 50%,
      #e5edf7 100%
    );
  color: var(--ink);
}

#map-wrapper {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

#title {
  text-align: center;
  margin-bottom: 8px;
  color: var(--blue-dark);
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 700;
}

#subtitle {
  text-align: center;
  margin: 0 0 18px;
  color: #5d6c7d;
  font-size: 15px;
}

#map-container {
  position: relative;
  background: rgba(255,255,255,0.92);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(30,55,90,0.12);
  overflow: hidden;
}

#map {
  width: 100%;
  min-height: 560px;
}

svg {
  display: block;
  width: 100%;
  height: auto;
}

.department {
  fill: var(--blue);
  stroke: #ffffff;
  stroke-width: 0.7px;
  cursor: pointer;

  transition:
    fill 0.2s ease,
    stroke 0.2s ease,
    stroke-width 0.2s ease,
    opacity 0.2s ease;
}

.department:hover {
  fill: #668fc8;
  stroke: #ffffff;
  stroke-width: 1.8px;
}

.department.emitter {
  fill: var(--gold);
}

.department.emitter:hover {
  fill: #ad7f39;
}

.department.selected {
  stroke: #172334;
  stroke-width: 2.5px;
}

#info-panel {
  display: none;

  position: absolute;
  top: 20px;
  right: 20px;

  width: min(360px, calc(100% - 40px));
  max-height: calc(100% - 40px);

  overflow-y: auto;

  background: rgba(255,255,255,0.98);

  border: 1px solid var(--border);
  border-radius: 16px;

  box-shadow:
    0 10px 35px rgba(20,40,70,0.22);

  padding: 20px;

  z-index: 10;
}

#info-panel.visible {
  display: block;
}

#close-button {
  position: absolute;

  right: 12px;
  top: 10px;

  border: 0;
  background: transparent;

  color: #647386;

  font-size: 25px;

  cursor: pointer;

  line-height: 1;
}

#close-button:hover {
  color: #1d2b3b;
}

#department-name {
  margin: 0 35px 5px 0;

  color: var(--blue-dark);

  font-size: 25px;
}

#department-code {
  color: #758396;

  font-size: 14px;

  margin-bottom: 14px;
}

#department-status {
  display: inline-block;

  padding: 6px 10px;

  border-radius: 20px;

  background: var(--blue-light);
  color: var(--blue-dark);

  font-size: 12px;
  font-weight: bold;

  margin-bottom: 15px;
}

#department-status.emitter-status {
  background: var(--gold-light);
  color: var(--gold-dark);
}

.info-section {
  margin-top: 15px;

  padding-top: 15px;

  border-top: 1px solid #e1e6ed;
}

.info-section h3 {
  margin: 0 0 8px;

  color: #334960;

  font-size: 15px;
}

.info-section p {
  margin: 5px 0;

  line-height: 1.5;

  font-size: 14px;
}

.emission-list {
  margin: 0;

  padding-left: 18px;
}

.emission-list li {
  margin-bottom: 7px;

  line-height: 1.4;

  font-size: 14px;
}

#more-info-container {
  margin-top: 18px;
}

#more-info-button {
  display: none;

  width: 100%;

  padding: 12px 16px;

  border: 0;

  border-radius: 10px;

  background: var(--gold);

  color: white;

  text-decoration: none;

  text-align: center;

  font-weight: bold;

  cursor: pointer;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

#more-info-button:hover {
  background: var(--gold-dark);

  transform: translateY(-1px);
}

#legend {
  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 18px;

  padding: 14px 15px 18px;

  color: #56677a;

  font-size: 13px;
}

.legend-item {
  display: flex;

  align-items: center;

  gap: 7px;
}

.legend-square {
  width: 17px;
  height: 17px;

  border-radius: 4px;

  border: 1px solid rgba(0,0,0,0.12);
}

.legend-blue {
  background: var(--blue);
}

.legend-gold {
  background: var(--gold);
}

#loading {
  min-height: 560px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: #607086;

  font-size: 15px;
}

#error {
  display: none;

  padding: 30px;

  text-align: center;

  color: #8c3b3b;
}

@media (max-width: 700px) {

  #map-wrapper {
    padding: 8px;
  }

  #map {
    min-height: 430px;
  }

  #info-panel {
    position: relative;

    top: auto;
    right: auto;

    width: auto;

    margin: 10px;

    max-height: none;
  }

  #loading {
    min-height: 430px;
  }
}
</style>
</head>

<body>

<div id="map-wrapper">

  <div id="legend">

/* =========================================================
   3. INFORMACIÓN HISTÓRICA DE LOS DEPARTAMENTOS
   =========================================================

   IMPORTANTE:

   Si un departamento aparece aquí, automáticamente
   aparecerá en DORADO en el mapa.

   Para añadir un nuevo departamento simplemente
   añadiremos su código en este objeto.
   ========================================================= */

const departmentData = {

  /* -------------------------------------------------------

  "60": {

/* =========================================================
   4. DETERMINAR AUTOMÁTICAMENTE LOS DEPARTAMENTOS
   CON INFORMACIÓN
   =========================================================

   Ya NO es necesario escribir manualmente una lista
   de departamentos emisores.

   El sistema comprueba automáticamente qué códigos
   existen en departmentData.

   Por tanto:

   departmentData["61"]  → Orne aparece dorado.

   departmentData["60"]  → Oise aparece dorado.

   Si posteriormente añadimos:

   departmentData["71"]

   Saône-et-Loire aparecerá automáticamente dorado.
   ========================================================= */

const emittingDepartments =
  new Set(
    Object.keys(departmentData)
  );


/* =========================================================
   5. GEOJSON DE LOS 96 DEPARTAMENTOS
   ========================================================= */

const geoJsonURL =
  "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson";


/* =========================================================
   6. ELEMENTOS DE LA INTERFAZ
   ========================================================= */

const mapElement =
  document.getElementById("map");

const loadingElement =
  document.getElementById("loading");

const errorElement =
  document.getElementById("error");

const infoPanel =
  document.getElementById("info-panel");

const closeButton =
  document.getElementById("close-button");

const departmentName =
  document.getElementById("department-name");

const departmentCode =
  document.getElementById("department-code");

const departmentStatus =
  document.getElementById("department-status");

const departmentDescription =
  document.getElementById("department-description");

const emissionSection =
  document.getElementById("emissions-section");

const emissionList =
  document.getElementById("emission-list");

const moreInfoButton =
  document.getElementById("more-info-button");


/* =========================================================
   7. CERRAR PANEL
   ========================================================= */

closeButton.addEventListener(
  "click",
  () => {

    infoPanel.classList.remove(
      "visible"
    );

    document
      .querySelectorAll(".department.selected")
      .forEach(element => {

        element.classList.remove(
          "selected"
        );

      });

  }
);


/* =========================================================
   8. MOSTRAR INFORMACIÓN
   ========================================================= */

function showDepartment(
  code,
  name,
  element
) {

  document
    .querySelectorAll(".department.selected")
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

    });


  element.classList.add(
    "selected"
  );


  const data =
    departmentData[code] || {};


  const hasEmission =
    emittingDepartments.has(code);


  departmentName.textContent =
    name || "Departamento";


  departmentCode.textContent =
    "Código: " + code;


  /* -------------------------------------------------------
     ESTADO DEL DEPARTAMENTO
     ------------------------------------------------------- */

  if (hasEmission) {

    departmentStatus.textContent =
      "INFORMACIÓN REGISTRADA";

    departmentStatus.classList.add(
      "emitter-status"
    );

  } else {

    departmentStatus.textContent =
      "Departamento";

    departmentStatus.classList.remove(
      "emitter-status"
    );

  }


  /* -------------------------------------------------------
     DESCRIPCIÓN
     ------------------------------------------------------- */

  departmentDescription.textContent =
    data.description ||
    "Actualmente no hay información histórica incorporada para este departamento.";


  /* -------------------------------------------------------
     EMISIONES
     ------------------------------------------------------- */

  emissionList.innerHTML = "";


  const emissions =
    data.emissions || [];


  if (
    emissions.length > 0
  ) {

    emissionSection.style.display =
      "block";


    emissions.forEach(
      emission => {

        const li =
          document.createElement(
            "li"
          );


        let text = "";


        if (
          emission.locality
        ) {

          text +=
            "<strong>" +
            escapeHTML(
              emission.locality
            ) +
            "</strong>";

        }


        if (
          emission.dates
        ) {

          text +=
            " — " +
            escapeHTML(
              emission.dates
            );

        }


        if (
          emission.denominations
        ) {

          text +=
            " — " +
            escapeHTML(
              emission.denominations
            );

        }


        li.innerHTML =
          text;


        emissionList.appendChild(
          li
        );

      }
    );

  } else {

    emissionSection.style.display =
      "none";

  }


  /* -------------------------------------------------------
     BOTÓN MÁS INFORMACIÓN
     ------------------------------------------------------- */

  const url =
    departmentLinks[code];


  if (
    url &&
    typeof url === "string" &&
    url.trim() !== ""
  ) {

    moreInfoButton.href =
      url.trim();


    moreInfoButton.style.display =
      "block";

  } else {

    moreInfoButton.removeAttribute(
      "href"
    );


    moreInfoButton.style.display =
      "none";

  }


  infoPanel.classList.add(
    "visible"
  );

}


/* =========================================================
   9. PROTEGER TEXTO HTML
   ========================================================= */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   10. CREAR MAPA
   ========================================================= */

async function createMap() {

  try {

    const response =
      await fetch(
        geoJsonURL
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "No se pudo descargar el GeoJSON."
      );

    }


    const geojson =
      await response.json();


    loadingElement.style.display =
      "none";


    const width =
      900;

    const height =
      760;


    const svg =
      d3
        .select("#map")
        .append("svg")

        .attr(
          "viewBox",
          `0 0 ${width} ${height}`
        )

        .attr(
          "preserveAspectRatio",
          "xMidYMid meet"
        );


    /* -------------------------------------------------------
       PROYECCIÓN DE FRANCIA
       ------------------------------------------------------- */

    const projection =
      d3
        .geoConicConformal()

        .parallels(
          [44, 49]
        )

        .rotate(
          [0, 0]
        )

        .center(
          [2.5, 46.5]
        )

        .fitSize(
          [
            width - 70,
            height - 70
          ],
          geojson
        );


    const path =
      d3
        .geoPath()
        .projection(
          projection
        );


    /* -------------------------------------------------------
       GRUPO PRINCIPAL
       ------------------------------------------------------- */

    const mapGroup =
      svg.append("g");


    /* -------------------------------------------------------
       DEPARTAMENTOS
       ------------------------------------------------------- */

    mapGroup

      .selectAll(
        ".department"
      )

      .data(
        geojson.features
      )

      .join("path")

      .attr(
        "class",
        feature => {

          const code =
            getDepartmentCode(
              feature
            );


          return emittingDepartments.has(
            code
          )

            ? "department emitter"

            : "department";

        }
      )

      .attr(
        "d",
        path
      )

      .attr(
        "data-code",
        feature =>
          getDepartmentCode(
            feature
          )
      )

      .on(
        "click",
        function(
          event,
          feature
        ) {

          event.stopPropagation();


          const code =
            getDepartmentCode(
              feature
            );


          const name =
            departments[code] ||

            feature.properties?.nom ||

            "Departamento";


          showDepartment(
            code,
            name,
            this
          );

        }
      );


    /* -------------------------------------------------------
       CLIC FUERA DEL MAPA
       ------------------------------------------------------- */

    svg.on(
      "click",
      function() {

        infoPanel.classList.remove(
          "visible"
        );


        document
          .querySelectorAll(
            ".department.selected"
          )
          .forEach(
            element => {

              element.classList.remove(
                "selected"
              );

            }
          );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    loadingElement.style.display =
      "none";


    errorElement.style.display =
      "block";

  }

}


/* =========================================================
   11. OBTENER CÓDIGO DEL DEPARTAMENTO
   ========================================================= */

function getDepartmentCode(
  feature
) {

  const properties =
    feature.properties || {};


  let code =

    properties.code ||

    properties.CODE_DEPT ||

    properties.code_dept ||

    properties.dep ||

    properties.id ||

    "";


  code =
    String(code)
      .trim()
      .toUpperCase();


  /* -------------------------------------------------------
     CORSE
     ------------------------------------------------------- */

  if (
    code === "2A" ||
    code === "2A0"
  ) {

    return "2A";

  }


  if (
    code === "2B" ||
    code === "2B0"
  ) {

    return "2B";

  }


  /* -------------------------------------------------------
     CÓDIGOS NUMÉRICOS
     ------------------------------------------------------- */

  if (
    /^\d+$/.test(code) &&
    code.length === 1
  ) {

    code =
      "0" + code;

  }


  return code;

}
